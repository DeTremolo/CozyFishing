<!doctype html>
<!-- Cozy Fishing — © 2026 DeTremolo Games. All rights reserved. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c140e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cozy Fishing</title>
  <meta name="author" content="DeTremolo Games">
  <meta name="copyright" content="© 2026 DeTremolo Games. All rights reserved.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="screen"></canvas>
  <p class="help">WASD walk &nbsp;·&nbsp; Mouse aim, hold = cast / reel in &nbsp;·&nbsp; R rod &nbsp;·&nbsp; Q lure &nbsp;·&nbsp; wheel hook / reel-in speed &nbsp;·&nbsp; F lamp &nbsp;·&nbsp; C cut &nbsp;·&nbsp; E sleep &nbsp;·&nbsp; T / Shift+T time speed &nbsp;·&nbsp; L sync clock &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M sound</p>
  <script>
    // Windows-sovelluksessa F11 vaihtaa koko näytön tilaa (ohjelma hoitaa ikkunan)
    addEventListener('keydown', (e) => {
      if (e.code === 'F11' && window.chrome && window.chrome.webview) {
        e.preventDefault();
        window.chrome.webview.postMessage('toggleFullscreen');
      }
    });
  </script>
  <!-- Kosketusohjaimet: näkyvät vain kosketusnäytöllä. Oikean reunan napit vaihtuvat tilan mukaan
       (ei onkea kädessä / onki kädessä / viehe heitetty), otsalampun nappi näkyy aina. -->
  <div id="touch-ui">
    <div class="sys-buttons">
      <button id="btn-pause" class="tbtn" aria-label="Pause">II</button>
      <button id="btn-sound" class="tbtn" aria-label="Sound">&#9834;</button>
      <button id="btn-full" class="tbtn" aria-label="Full screen">&#9974;</button>
    </div>
    <button id="btn-light" class="tbtn" aria-label="Headlamp">LAMP</button>
    <!-- Kelausnopeuden liukusäädin: näkyy vain, kun uistimen kelaus-painiketta pidetään pohjassa -->
    <div id="reel-slider"><div id="reel-knob"></div></div>
    <div class="action-buttons">
      <!-- alhaalta ylös: pääpainike, sivupainikkeet; ryhmät näytetään tilan mukaan -->
      <button id="btn-cast" class="tbtn big" aria-label="Cast or reel in">CAST</button>
      <button id="btn-chop" class="tbtn big" aria-label="Swing the axe">CHOP</button>
      <button id="btn-release" class="tbtn" aria-label="Release line">RELEASE LINE</button>
      <button id="btn-lure" class="tbtn" aria-label="Change lure">LURE</button>
      <div id="stepper" class="stepper">
        <button id="btn-minus" class="tbtn" aria-label="Decrease">-</button>
        <span id="step-label">HOOK</span>
        <button id="btn-plus" class="tbtn" aria-label="Increase">+</button>
      </div>
      <button id="btn-cut" class="tbtn" aria-label="Cut line">CUT</button>
      <button id="btn-rod" class="tbtn big" aria-label="Rod">ROD</button>
      <button id="btn-stow" class="tbtn big" aria-label="Put the tool away">STOW AXE</button>
      <button id="btn-axe" class="tbtn" aria-label="Take the axe">AXE</button>
      <button id="btn-knife" class="tbtn" aria-label="Take the knife">KNIFE</button>
      <button id="btn-act" class="tbtn" aria-label="Action">ACT</button>
      <button id="btn-act2" class="tbtn" aria-label="Action 2">ACT</button>
      <button id="btn-act3" class="tbtn" aria-label="Action 3">ACT</button>
    </div>
  </div>
  <div id="rotate">Turn your phone sideways</div>
  <script src="game.js"></script>
  <script src="touch.js"></script>
</body>
</html>
